name: BSD de Rham geometry

on:
  push:
    branches: [bsd-projection-certificates]
    paths: [.github/workflows/bsd-de-rham-geometry.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-de-rham-geometry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [katz, pole-core]
    container:
      image: sagemath/sagemath:10.10
      options: --user 0
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and check the finite geometry
        shell: bash
        env:
          BSD_GEOMETRY_MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          mkdir -p "geometry-output/$BSD_GEOMETRY_MODE"
          timeout 45m sage -python \
            research/bsd-localization/de_rham_strategy/backend_probe.py \
            --mode "$BSD_GEOMETRY_MODE" --digits 6 \
            --output "geometry-output/$BSD_GEOMETRY_MODE" \
            2>&1 | tee "geometry-output/$BSD_GEOMETRY_MODE/run.log"

      - name: Preserve geometry and verification provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bsd-geometry-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: geometry-output/${{ matrix.mode }}/
