name: BSD Katz geometry from certified low weight products

on:
  push:
    branches: [bsd-projection-certificates]
    paths: [.github/workflows/bsd-de-rham-geometry.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-de-rham-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [katz]
    container:
      image: sagemath/sagemath:10.10@sha256:310dfe23fc786f3a5a06a7b0387c60201ec79b32c0db941b7624505ee5edb565
      options: --user 0
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the long basis replay on the small example
        shell: bash
        run: |
          set -o pipefail
          mkdir -p geometry-output/supplier-smoke
          timeout 5m sage -python research/bsd-localization/pole_core_fast/build_core.py \
            --level 11 --q-precision 40 --stop-weight 6 \
            --output geometry-output/supplier-smoke/short \
            2>&1 | tee geometry-output/supplier-smoke/short.log
          timeout 5m sage -python research/bsd-localization/pole_core_fast/katz_supplier.py \
            --checkpoints geometry-output/supplier-smoke/short --digits 3 --q-precision 80 \
            --output geometry-output/supplier-smoke/long \
            2>&1 | tee geometry-output/supplier-smoke/long.log

      - name: Build the pilot low weight bases
        shell: bash
        run: |
          set -o pipefail
          mkdir -p geometry-output/short-bases-389
          timeout 10m sage -python research/bsd-localization/pole_core_fast/build_core.py \
            --level 389 --q-precision 390 --stop-weight 6 \
            --output geometry-output/short-bases-389 \
            2>&1 | tee geometry-output/short-bases-389/run.log

      - name: Build and check the finite Katz geometry
        shell: bash
        env:
          BSD_GEOMETRY_MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          mkdir -p "geometry-output/$BSD_GEOMETRY_MODE"
          timeout 35m sage -python \
            research/bsd-localization/de_rham_strategy/backend_probe.py \
            --mode "$BSD_GEOMETRY_MODE" --digits 6 \
            --low-weight-checkpoints geometry-output/short-bases-389 \
            --matrix-fit certified \
            --output "geometry-output/$BSD_GEOMETRY_MODE" \
            2>&1 | tee "geometry-output/$BSD_GEOMETRY_MODE/run.log"

      - name: Preserve geometry and verification provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bsd-geometry-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: geometry-output/
