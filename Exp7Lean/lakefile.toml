name = "Exp7Lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Exp7Lean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Exp7Lean"
# This library is written as ordinary (non-`module`) Lean files that import Mathlib.
# Without this flag Lake repeats a warning about that for every path in the import graph.
allowNonModules = true

# The kernel-checked search certificates and the theorems that use them.
# Not a default target: checking the certificates takes about 11 core-hours and about 5 GB of
# memory per job.  Build with `lake build Exp7Full`.
[[lean_lib]]
name = "Exp7Full"
allowNonModules = true
